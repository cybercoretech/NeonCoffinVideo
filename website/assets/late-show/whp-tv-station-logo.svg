<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">WHP-TV station logo</title><desc id="desc">An original illustrated broadcast tower rises over Harrow Point’s dark cliffs, sending colored signal rings across the sea beside a custom HPTV Channel 13 wordmark.</desc>
